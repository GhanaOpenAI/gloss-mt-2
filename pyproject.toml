[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gloss-mt-2"
version = "0.1.0"
description = "GLOSS-MT-2: Machine translation with preserved source noun phrases and post-translation glossary substitution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ghana Open AI", email = "info@ghananlp.org"}
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "sentencepiece",
    "protobuf",
    "sacremoses",
    "sacrebleu>=2.4.0",
    "spacy>=3.7.0",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gloss_mt_2*"]

[tool.setuptools.package-data]
"gloss_mt_2" = ["data/*.tsv.gz"]
