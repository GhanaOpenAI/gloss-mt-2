[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nkrane-mt"
version = "0.1.0"
description = "Nkrane-MT: Entity-grounded machine translation with preserved source noun phrases and post-translation glossary substitution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ghana Open AI", email = "info@ghananlp.org"}
]
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "sentencepiece",
    "protobuf",
    "sacremoses",
    "sacrebleu>=2.4.0",
    "spacy>=3.7.0",
    "requests",
    "nltk>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nkrane_mt*"]

[tool.setuptools.package-data]
"nkrane_mt" = ["data/*.tsv.gz"]
